name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.5 is a released stable version and composer declares only a lower bound
        # (`php: >=8.2`), so it is in the supported range and must be tested rather
        # than tolerated. It caught two real breaks the day it shipped: `#[\Attribute]`
        # became a fatal error on abstract classes, and `setAccessible()` became a
        # deprecation.
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, mongodb
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      # Permissions are part of the behaviour (the router refuses to load a route
      # table from a group/world-writable directory), and umask silently changes what
      # a test creates: `mkdir($d, 0775)` is 0755 under the usual 0022. Windows CI
      # cannot see any of this -- there are no POSIX mode bits there -- so pinning the
      # umask here is the only thing that makes those tests meaningful.
      - name: Run test suite
        run: |
          umask 0022
          composer test
